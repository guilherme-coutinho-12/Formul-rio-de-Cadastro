<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Simples</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
      
        body {
            width=100%;
            background: linear-gradient(135deg, #3c006b, #6b21a8, #9948d9, black);
            background-size: 400% 400%;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 7rem 2rem 4rem 2rem;
            animation: fluirGradiente 12s ease-in-out infinite;
            font-family: "Redaction 35", serif;
      font-weight: 400;
      font-style: normal;
        }

        @keyframes fluirGradiente {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
        }

        form {
            display: grid;
            gap: 10px;
        }

        input, button {
          border-radius: 5px;
            padding: 8px;
            color: black;
            background-color: #ccfff2;
            transform: scale(1);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        #resultado {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        h1 {
       display: flex;
       align-items: center;
       justify-content: center;
        }
        h2 {
      display: flex;
       align-items: center;
       justify-content: center;
        }

        input:hover {
          transform: scale(1.005);
          font-size: 1.2rem;
          transition: 0.5s
        }

      button:hover {
        font-size: 1.2rem;
        color: white;
        background-color: #0c0124;
        transition: 0.5s
      }
        
      .redaction-35-regular {
      font-family: "Redaction 35", serif;
      font-weight: 400;
      font-style: normal;
      }
    </style>
</head>

<body>

    <main>
        <h1>Formulário de Cadastro</h1>

        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <label for="cor">Cor preferida:</label>
            <input type="color" id="cor" value="#000000">

            <button type="submit">Enviar</button>
        </form>

        <section>
            <h2>Dados preenchidos</h2>
            <div id="resultado"></div>
        </section>
    </main>

    <script>
        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const nome = document.getElementById("nome").value;
            const nascimento = document.getElementById("nascimento").value;
            const cor = document.getElementById("cor").value;

            resultado.innerHTML = "";

            const pNome = document.createElement("p");
            pNome.textContent = "Nome: " + nome;

            const pNascimento = document.createElement("p");
            pNascimento.textContent = "Nascimento: " + nascimento;

            const pCor = document.createElement("p");
            pCor.textContent = "Cor preferida: " + cor;

            const amostraCor = document.createElement("div");
            amostraCor.style.backgroundColor = cor;
            amostraCor.style.width = "100px";
            amostraCor.style.height = "40px";
            amostraCor.style.border = "1px solid black";

            resultado.appendChild(pNome);
            resultado.appendChild(pNascimento);
            resultado.appendChild(pCor);
            resultado.appendChild(amostraCor);
        });
    </script>

</body>
</html>
